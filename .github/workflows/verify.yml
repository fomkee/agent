name: verify

on:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Linux architecture to verify
        type: choice
        default: x86_64
        options: [x86_64, arm64]

permissions:
  contents: read

concurrency:
  group: agent-verify-${{ github.ref }}-${{ inputs.platform || 'x86_64' }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast
